name: Docker

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Validate and build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate production compose file
        run: docker compose -f Fabrik3D/compose.production.yaml config --quiet

      - name: Build compose images
        run: docker compose -f Fabrik3D/compose.production.yaml build
