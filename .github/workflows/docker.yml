name: Docker

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Validate and build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate production compose file
        run: docker compose -f Fabrik3D/compose.production.yaml config --quiet

      # Base-image pulls occasionally fail on shared runners (registry
      # throttling or transient network errors), so retry the build.
      - name: Build compose images
        run: |
          for attempt in 1 2 3; do
            echo "Docker build attempt ${attempt}"
            if docker compose -f Fabrik3D/compose.production.yaml build; then
              exit 0
            fi
            echo "Attempt ${attempt} failed; retrying in 30s..."
            sleep 30
          done
          echo "Docker build failed after 3 attempts." >&2
          exit 1
